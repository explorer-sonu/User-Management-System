<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registration | MyApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/webjars/jquery/3.6.4/jquery.min.js"></script>
    <script>
    	$(document).ready(function(){
    		$("#countryId").on("change",function() {
    			var cid = $("#countryId").val();
    			
    			$('#stateId').find('option').remove();
				$('<option>').val('').text('-Select-').appendTo("#stateId");
				
				$('#cityId').find('option').remove();
				$('<option>').val('').text('-Select-').appendTo("#cityId");

    			$.ajax({
    				type: 'GET',
    				url: '/states/' + cid,
    				success: function (response){
    					console.log(response);    					
    					// iterate response entries and display as state drop down options
    					$.each(response, function(key,value){
    						$('<option>').val(key).text(value).appendTo("#stateId");
    					});
    				}
    			});
    			
    		});
    		
    		$("#stateId").on("change",function() {
    			var stateId = $("#stateId").val();
    			
    			$('#cityId').find('option').remove();
				$('<option>').val('').text('-Select-').appendTo("#cityId");

    			
    			$.ajax({
    				type: 'GET',
    				url: '/cities/' + stateId,
    				success: function (response){
    					console.log(response);    					
    					// iterate response entries and display as state drop down options
    					$.each(response, function(key,value){
    						$('<option>').val(key).text(value).appendTo("#cityId");
    					});
    				}
    			});
    			
    		});
    	});
    </script>
    <style>
      body {
        background: linear-gradient(to right, #74ebd5, #9face6);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', sans-serif;
      }
      .register-box {
        background-color: #fff;
        padding: 15px;
        border-radius: 15px;
        box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 600px;
      }
      .btn-primary {
        background-color: #6c5ce7;
        border: none;
      }
      .btn-primary:hover {
        background-color: #5a4bd6;
      }
      .login-link {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #0984e3;
        text-decoration: none;
      }
      .login-link:hover {
        text-decoration: underline;
      }
      .error-msg {
        color: red;
        text-align: center;
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <div class="register-box">
      <h3 class="text-center mb-4">Register Here</h3>

      <p class="error-msg" th:text="${emsg}"></p>
      <p class="text-success" th:if="${smsg}" th:text="${smsg}"></p>      

      <form th:action="@{/register}" th:object="${registerForm}" method="post">
        <div class="mb-3">
          <label for="uname" class="form-label">Name</label>
          <input type="text" th:field="*{uname}" class="form-control" placeholder="Enter your name">
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" th:field="*{email}" class="form-control" placeholder="Enter your email">
        </div>

        <div class="mb-3">
          <label for="phno" class="form-label">Phone</label>
          <input type="number" th:field="*{phno}" class="form-control" placeholder="Enter your phone number">
        </div>

        <div class="mb-3">
          <label for="country" class="form-label">Select Country</label>
          <select th:field="*{countryId}" class="form-select">
		      <option value="">-Select-</option>
		      <option th:each="entry : ${countries.entrySet()}"
		              th:value="${entry.key}"
		              th:text="${entry.value}">
		      </option>
	      </select>
        </div>

        <div class="mb-3">
          <label for="state" class="form-label">Select State</label>
          <select th:field="*{stateId}" class="form-select">
            <option value="">-Select-</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="city" class="form-label">Select City</label>
          <select th:field="*{cityId}" class="form-select">
            <option value="">-Select-</option>
          </select>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Register</button>
        </div>
      </form>

      <a href="/" class="login-link">Already have an account? Login here</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
