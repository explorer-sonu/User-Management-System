<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quote Display</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body {
        background-color: #f0f2f5;
      }
      .quote-card {
        max-width: 600px;
        margin: 80px auto;
        padding: 30px;
        background-color: white;
        border-radius: 15px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      }
      .quote-text {
        font-size: 1.4rem;
        font-style: italic;
        color: #333;
      }
      .quote-author {
        font-size: 1rem;
        color: #666;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="quote-card text-center">
        <h3 class="mb-4">Today's Motivation</h3>
        <p class="quote-text" th:text="*{quote.quote}">"Your quote will appear here."</p>
        <p class="quote-author" th:text="*{quote.author}">- Author Name</p>
        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center mt-4">
          <a href="dashboard" class="btn btn-primary">Get New Quote</a>
          <a href="/" class="btn btn-outline-secondary">Logout</a>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
