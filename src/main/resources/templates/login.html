<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | MyApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body {
        background: linear-gradient(to right, #74ebd5, #9face6);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', sans-serif;
      }
      .login-box {
        background-color: #fff;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
      }
      .btn-primary {
        background-color: #6c5ce7;
        border: none;
      }
      .btn-primary:hover {
        background-color: #5a4bd6;
      }
      .signup-link {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #0984e3;
        text-decoration: none;
      }
      .signup-link:hover {
        text-decoration: underline;
      }
      .error-msg {
        color: red;
        text-align: center;
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h3 class="text-center mb-4">Login</h3>

      <p class="error-msg" th:text="${emsg}"></p>

      <form th:action="@{/login}" th:object="${loginForm}" method="post">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="text" th:field="*{email}" class="form-control" id="email" placeholder="Enter your email">
        </div>
        <div class="mb-3">
          <label for="pwd" class="form-label">Password</label>
          <input type="password" th:field="*{pwd}" class="form-control" id="pwd" placeholder="Enter your password">
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Login</button>
        </div>
      </form>

      <a href="register" class="signup-link">Don't have an account? Sign Up Here</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
