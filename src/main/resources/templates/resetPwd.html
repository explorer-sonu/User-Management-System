<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body {
        background: linear-gradient(to right, #74ebd5, #9face6);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .card {
        border-radius: 1rem;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      }
      .form-control:focus {
        box-shadow: none;
        border-color: #6c63ff;
      }
      .btn-primary {
        background-color: #6c63ff;
        border-color: #6c63ff;
      }
      .btn-primary:hover {
        background-color: #5753d4;
        border-color: #5753d4;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card p-4">
            <h3 class="text-center mb-4">Reset Password</h3>
            <form th:action="@{/resetPwd}" th:object="${resetPwd}" method="post">
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="text" th:field="*{email}" class="form-control" readonly>
              </div>
              <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" th:field="*{newPwd}" class="form-control" placeholder="Enter new password">
              </div>
              <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" th:field="*{confirmPwd}" class="form-control" placeholder="Confirm password">
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary">Update Password</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
